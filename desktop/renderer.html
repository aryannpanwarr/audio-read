<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Read Audiobook Generator</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <h1>Audio Read</h1>
          <p>PC audiobook generator</p>
        </div>
        <button id="openOutput" class="ghost" disabled>Open Output</button>
      </header>

      <section class="panel">
        <div class="field wide">
          <label for="inputPath">Book</label>
          <div class="pathRow">
            <input id="inputPath" readonly placeholder="Choose EPUB or TXT" />
            <button id="chooseInput">Choose</button>
          </div>
        </div>

        <div class="field wide">
          <label for="outputPath">Output Folder</label>
          <div class="pathRow">
            <input id="outputPath" readonly placeholder="Default: audiobook-output/book-name" />
            <button id="chooseOutput">Choose</button>
          </div>
        </div>

        <div class="grid">
          <label class="field">
            Voice
            <div class="voiceRow">
              <select id="voice">
                <option value="af_heart">af_heart</option>
                <option value="af_bella">af_bella</option>
                <option value="af_nicole">af_nicole</option>
                <option value="af_sarah">af_sarah</option>
                <option value="af_sky">af_sky</option>
                <option value="am_adam">am_adam</option>
                <option value="am_michael">am_michael</option>
                <option value="bf_emma">bf_emma</option>
                <option value="bf_isabella">bf_isabella</option>
                <option value="bm_george">bm_george</option>
              </select>
              <button id="previewVoice" type="button">Preview</button>
            </div>
          </label>

          <label class="field">
            Speed
            <input id="speed" type="number" min="0.7" max="1.4" step="0.05" value="1" />
          </label>

          <label class="field">
            Model Type
            <select id="dtype">
              <option value="q8">q8</option>
              <option value="fp32">fp32</option>
              <option value="q4">q4</option>
              <option value="q4f16">q4f16</option>
            </select>
          </label>

          <label class="field">
            Backend
            <select id="device">
              <option value="cpu">CPU</option>
              <option value="cuda">CUDA / RTX</option>
            </select>
          </label>

          <label class="field">
            Segment Limit
            <input id="limit" type="number" min="1" step="1" placeholder="Blank = full book" />
          </label>

          <label class="field">
            Workers
            <input id="concurrency" type="number" min="1" max="8" step="1" value="4" />
          </label>
        </div>

        <label class="field wide">
          Preview Text
          <input id="previewText" value="This is a short voice preview from Audio Read." />
        </label>

        <label class="check">
          <input id="dryRun" type="checkbox" />
          Preview only, no audio
        </label>

        <div class="actions">
          <button id="start" class="primary">Generate Audiobook</button>
          <button id="cancel" class="danger" disabled>Cancel</button>
        </div>
      </section>

      <section class="statusbar">
        <div>
          <strong id="state">Idle</strong>
          <span id="detail">Choose a book to start.</span>
        </div>
        <audio id="previewPlayer" controls></audio>
        <div class="progress">
          <div id="progressFill"></div>
        </div>
      </section>

      <section class="consolePanel">
        <div class="consoleHead">
          <span>Generator Log</span>
          <button id="clearLog" class="ghost">Clear</button>
        </div>
        <pre id="log"></pre>
      </section>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
